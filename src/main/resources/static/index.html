<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
  <label for="chatLog"></label>
  <textarea id="chatLog" rows="4" cols="50"></textarea>

  <script type="text/javascript">
    const eventSource = new EventSource('/chat/streaming?userMessage=Tell me a long joke in korean');

    eventSource.addEventListener('message', (event) => {
      document.getElementById('chatLog').value += event.data;
    });

    eventSource.addEventListener('error', (err) => {
      console.log('Error message:', err);
      eventSource.close();
    });

    console.log('Hi');
  </script>
</body>
</html>
